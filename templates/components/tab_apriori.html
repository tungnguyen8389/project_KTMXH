<!-- TAB 4: APRIORI ASSOCIATION RULES [TV2 + TV4] -->
<section id="tab-apriori" class="tab-panel active">
    <div style="display:flex;flex-direction:column;gap:1.5rem;">
        <div class="card">
            <div class="card-header flex-between">
                <h3>Tham Số Apriori</h3>
                <div class="btn-group-sm">
                    <button type="button" id="ap-mode-db" class="btn btn-primary btn-sm active">📊 Dữ Liệu Nhân Sự (DB)</button>
                    <button type="button" id="ap-mode-custom" class="btn btn-secondary btn-sm">📝 Dữ Liệu Tùy Chỉnh (JSON)</button>
                </div>
            </div>
            <div class="card-body">
                <!-- Custom JSON mode: paste slide transactions to compare results -->
                <div id="ap-custom-controls" style="display:none;">
                    <div class="form-group">
                        <label>Ví dụ có sẵn từ slide:</label>
                        <select id="ap-preset" class="form-control">
                            <option value="slide">Ví dụ slide 11–35 (minsupp=0.4, minconf=0.67)</option>
                            <option value="bt1">Bài tập 1 – slide 21 (minsupp=0.3, minconf=1.0)</option>
                            <option value="bt2">Bài tập 2 – slide 22 (minsupp=0.3, minconf=1.0)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Giao dịch (JSON) — hỗ trợ <code>[{"tid","items"}]</code>, <code>{"o1": [...]}</code>, <code>[[...]]</code>, cặp <code>{"tid","item"}</code> hoặc ma trận nhị phân:</label>
                        <textarea id="ap-json-input" class="form-control code-editor" rows="8"></textarea>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Min Support (%):</label>
                        <input type="number" id="ap-minsupp" class="form-control" value="5" step="1">
                    </div>
                    <div class="form-group">
                        <label>Min Confidence (%):</label>
                        <input type="number" id="ap-minconf" class="form-control" value="30" step="5">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Min Lift:</label>
                        <input type="number" id="ap-minlift" class="form-control" value="1.2" step="0.1">
                    </div>
                </div>
                <button id="btn-run-apriori" class="btn btn-primary btn-block">Khai Thác Tập Phổ Biến & Luật</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>Tập Phổ Biến F_k & Thẻ Luật Kết Hợp</h3>
            </div>
            <div class="card-body" style="display:flex;flex-direction:column;gap:2rem;">
                <!-- 1. Binary table (row per transaction) -->
                <div id="ap-bitvectors-box" class="table-responsive"></div>
                <!-- 1b. Candidate C_k with v(S) and SP (JSON mode only, mirrors slides 30-35) -->
                <div id="ap-candidates-box"></div>
                <!-- 2. Rule cards satisfying min confidence -->
                <div>
                    <h4 class="mb-2">Các Luật Kết Hợp Thỏa Mãn MinConf</h4>
                    <div id="ap-rules-cards" class="rules-grid scroll-grid"></div>
                </div>
                <!-- 3. Maximal frequent itemsets (compact summary, before the
                     full F_k grid which can hold hundreds of cards) -->
                <div id="ap-maximal-box"></div>
                <!-- 4. Frequent-itemset cards -->
                <div id="ap-itemsets-box">
                    <p class="placeholder-text">Các tập phổ biến $F_k$ sẽ được tạo tại đây.</p>
                </div>
            </div>
        </div>
    </div>
</section>
