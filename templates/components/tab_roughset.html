<!-- TAB 2: ROUGH SET & REDUCT [TV1 + TV4] -->
<section id="tab-roughset" class="tab-panel">
    <div class="panel-grid">
        <div class="card">
            <div class="card-header">
                <h3>Hệ Thông Tin Tập Thô & Rút Gọn</h3>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>Thuộc tính điều kiện $C$ (phân cách bằng dấu phẩy):</label>
                    <input type="text" id="rs-cond-attrs" class="form-control" value="">
                </div>
                <div class="form-group">
                    <label>Thuộc tính quyết định $D$:</label>
                    <input type="text" id="rs-dec-attr" class="form-control" value="">
                </div>
                <div class="form-group">
                    <label>Bảng Hệ thông tin (JSON):</label>
                    <textarea id="rs-json-input" class="form-control code-editor" rows="7"></textarea>
                </div>
                <div class="btn-group-2">
                    <button id="btn-run-rs" class="btn btn-primary">Xấp Xỉ Trên/Dưới & k</button>
                    <button id="btn-run-reduct" class="btn btn-secondary">Ma Trận Phân Biệt & Reduct</button>
                </div>
                <div class="form-group" style="margin-top:0.75rem;">
                    <label for="rs-sample-size">Số bản ghi lấy mẫu từ DB (0 = toàn bộ 1.470, lấy mẫu phân tầng theo Attrition):</label>
                    <input type="number" id="rs-sample-size" class="form-control" value="30" min="0" max="1470">
                </div>
                <button id="btn-prefill-rs-hr" class="btn btn-outline-primary btn-block mt-2" type="button">
                    Nạp dữ liệu HR (Attrition) từ DB
                </button>
                <div id="rs-prefill-report" class="small text-muted mt-2"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>Kết Quả Phân Tích Tập Thô</h3>
            </div>
            <div class="card-body">
                <div id="rs-slide-check"></div>
                <div id="rs-katex-output" class="formula-box">
                    <p class="placeholder-text">Kết quả tính toán Xấp xỉ và Rút gọn Boole sẽ hiển thị tại đây.</p>
                </div>
                <div id="rs-matrix-output" class="table-responsive mt-3"></div>
            </div>
        </div>
    </div>
</section>
